<!-- The href Attribute -->
<a href="www.google.com">Vist Google</a>
<!-- The <a> tag defines a hyperlink. 
      The (href) attribute specified the URL of the page link goes to. 
-->

<!-- The src Attribute -->
<img src="image.jpg">
<!-- The <img> tag is used to embed an image in an HTML page.
      The (src) attribute specifies the path to the image to be displayed.
 -->

<!-- The width and height Attributes -->
<img src="image.jpg" width="500" height="500">
<!-- The <img> tag should also contain the width and height attributes, which specify the width and height of the image (in pixels). -->

<!-- The alt Attribute -->
<img src="image.jpg" alt="Cat eating">
<!-- The required alt attribute for the <img> tag specifies an alternate text for an image, if the image for some reason cannot be displayed.
       This can be due to a slow connection, or an error in the src attribute, or if the user uses a screen reader.
  -->

<!-- The style Attribut -->
<p style="color:red">This is a red paragraph.</p>
<!-- The style attribute is used to add styles to an element, such as color, font, size, and more. -->

<!-- The lang Attribute -->
<!DOCTYPE html>
<html lang="en">

<body>
    .................
</body>

</html>
<!-- lang="en" or lang="en-US" to declare the language of the Web page. -->

<!-- The title Attribute -->
<p title="Hello, I'm Ben">This is a paragraph.</p>
<!-- The title attribute defines some extra information about an element. -->

<!-- Single or Double Quotes? -->
<p title='Hello "I am John " live in New York.'></p>
<!--Or vice versa-->
<p title="Hello 'I am John' live in New York. "></p>
<!-- Double quotes around attribute values are the most common in HTML, but single quotes can also be used.
     In some situations, when the attribute value itself contains double quotes, it is necessary to use single quotes.
-->
