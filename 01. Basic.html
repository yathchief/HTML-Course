<!-- HTML Documents -->

<!-- The <!DOCTYPE> Declaration-->
<!DOCTYPE html>
<!-- All HTML documents must start with a document type declaration: <!DOCTYPE html>.
        <!DOCTYPE> delclaration represent the document type, and helps browsers to web pages correctly.
        It must only apper once, at the top of the page (before any HTML tags).
        <!DOCTYPE> declaration is not case sensitvie.
        <!DOCTYPE> declaration dor HTML5.
 -->

<!-- HTML headings-->
<h1>Hello</h1>
<h2>Hello</h2>
<h3>Hello</h3>
<h4>Hello</h4>
<h5>Hello</h5>
<h6>Hello</h6>
<!-- The HTML document itself begins with <html> and end with </html> 
        HTML heading are defined with the <h1> to <h6> tags.
        <h1> defines the most important heading.
        <h6> defines the least important heading.
-->

<!--HTML Paragraphs-->
<p>Hello, World</p>
<!-- HTML paragraphs are defined with the <p> tag-->

<!--HTML Links-->
<a href="https://www.w3schools.com">This is a link</a>
<!-- The link's destination is specified in the href attribute.
     Attributes are used to provide additional information about HTML elements.
-->

<!--HTML Images-->
<img src="w3schools.jpg" alt="W3Schools.com" width="104" height="142">
<!-- HTML images are defined with the <img> tag.
     The source file (src), alternative text (alt), (width), and (height) are provide as attributes -->
