<!--Chapter Summary-->
<!--
Use the (style) attribute for styling HTML elements
Use (background-color) for background color
Use (color) for text colors
Use (font-family) for text fonts
Use (font-size) for text sizes
Use (text-align) for text alignment
-->

<!-- The HTML Style Attribute -->
<tagname style="property:value;">
    <!-- The HTML style attribute is used to add styles to an element, such as color, font, size, and more.
     The property is a CSS property. The value is a CSS value.
-->

    <!-- Background Color -->

    <body style="background-color: powderblue;">
        <h1>This is heading</h1>
        <p>This is a pragraph</p>
    </body>
    <!-- The CSS background-color property defines the background color for an HTML element. -->
    <!-- Background Color (Option 2) -->

    <body>
        <h1 style="background-color: powderblue;"></h1>
        <p style="background-color: tomato;"></p>
    </body>

    <!-- Text Color -->
    <h1 style="color: blue;">This is heading</h1>
    <p style="color: red;">This is paragraph</p>

    <!-- Fonts -->
    <h1 style="font-family: Verdana;">This is heading</h1>
    <p style="font-family: Courier New;">This is a paragraph</p>

    <!-- Text Size-->
    <h1 style="font-size: 300%;">This is heading</h1>
    <p style="font-size: 150%;">This is paragraph</p>

    <!-- Text Alignment -->
    <h1 style="text-align: center;">Centerd heading</h1>
    <p style="text-align: center;">Centered paragraph</p>
