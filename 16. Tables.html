<!-- HTML Table Tags -->
<!-- 
Tag---------Description
<table>  	Defines a table
<th>	    Defines a header cell in a table
<tr>	    Defines a row in a table
<td>    	Defines a cell in a table
<caption> 	Defines a table caption
<colgroup>	Specifies a group of one or more columns in a table for formatting
<col>	    Specifies column properties for each column within a <colgroup> element
<thead>	    Groups the header content in a table
<tbody>   	Groups the body content in a table
<tfoot>  	Groups the footer content in a table
 -->

<!-- Table Cells -->
<table>
  <tr>
    <td>Adam</td> <!--Table Cells-->
    <td>Bob</td> <!--Table Cells-->
    <td>Cane</td> <!--Table Cells-->
  </tr>
</table>

<!-- Table Rows -->
<table>
  <tr> <!--Table Rows-->
    <td>Adam</td>
    <td>Bob</td>

</table>

<table>
  <tr>
    <th>Person 1</th> <!--Header Cells-->
    <th>Person 2</th> <!--Header Cells-->
    <th>Person 3</th> <!--Header Cells-->
  </tr>
</table>

<!-- HTML Table Borders -->
<!-- Add a Table Border -->
<style>
  table,
  th,
  td {
    border: 1px solid black;
  }
</style>

<!-- Collapsed Table Borders -->
<style>
  table,
  th,
  td {
    border: 1px solid black;
    border-collapse: collapse;
  }
</style>

<!-- Style Table Borders -->
<style>
  table,
  th,
  td {
    border: 1px solid black;
    border-collapse: collapse;
  }

  th,
  td {
    background-color: #96D4D4;
  }
</style>

<!-- Round Table Borders -->
<style>
  table,
  td {
    border: 1px solid black;
    border-radius: 10px;
  }
</style>

<!-- Dotted Table Borders -->
<style>
  th,
  td {
    border-style: dotted;
  }
</style>

<!-- Border Color-->
<style>
  th,
  td {
    border-color: green;
  }
</style>

<!-- HTML Table Sizes -->
<!--Table Sizes -->
<style>

  td {

<!-- Table Column Width -->
 <style>
  table, th, td{
    border: 1px solid black;
    border-collapse: collapse;
  }
 </style>
 <body>
 <table style="width:100%">
