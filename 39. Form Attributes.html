<!-- HTML Form Attributes -->
 <!-- Form Attributes -->
  <!-- 
 The HTML <form> element has many attributes
action - the action to be performed when the form is submitted
target - where to display the response
method - the HTTP method to be used when sending form data
autocomplete - whether a form should have autocomplete on or off
novalidate - the form should not be validated when submitted
  -->

  <!-- The Action Attribute -->
<form action="/action_page.php">
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname" value="John"><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" value="Doe"><br><br>
  <input type="submit" value="Submit">
</form>

<!-- The Target Attribute -->
<form action="/action_page.php" target="_blank"></form>

<!-- The Method Attribute -->
 <form action="/action_page.php" method="get"></form> <!-- GET method -->
<form action="/action_page.php" method="post"></form> <!-- POST method -->

<!-- The Autocomplete Attribute -->
 <form action="/action_page.php" autocomplete="on"></form>

 <!-- The Novalidate Attribute -->
  <form action="/action_page.php" novalidate></form>

  <!--All HTML <form> Attributes -->
    <!-- 
    Attribute-------Description
accept-charset	    Specifies the character encodings used for form submission
action	                    Specifies where to send the form-data when a form is submitted
autocomplete	    Specifies whether a form should have autocomplete on or off
enctype	                Specifies how the form-data should be encoded when submitting it to the server (only for method="post")
method	                Specifies the HTTP method to use when sending form-data
name	                 Specifies the name of the form
novalidate	        Specifies that the form should not be validated when submitted
rel	                        Specifies the relationship between a linked resource and the current document
target	                Specifies where to display the response that is received after submitting the form-->
